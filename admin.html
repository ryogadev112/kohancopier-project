<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - KohanCopier</title>
    <!-- Supabase JS Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; min-height: 100vh; }
        
        /* LAYAR LOGIN */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-card {
            background: #1e293b;
            padding: 32px;
            border-radius: 16px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-card h2 { margin-top: 0; color: #3b82f6; font-size: 22px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: white; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #3b82f6; }
        .btn-login { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-login:hover { background: #1d4ed8; }
        .error-msg { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }

        /* DASHBOARD UTAMA (Hidden default) */
        .dashboard-wrapper { display: none; max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #334155; }
        h1 { margin: 0; font-size: 22px; color: #3b82f6; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .btn-action { background: #334155; color: white; border: 1px solid #475569; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-action:hover { background: #475569; }
        .btn-logout { background: #dc2626; border-color: #ef4444; }
        .btn-logout:hover { background: #b91c1c; }

        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #334155; font-size: 13px; }
        th { background: #0f172a; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        tr:hover { background: #26334d; }
    </style>
</head>
<body>

    <!-- SECTION 1: LAYAR LOGIN ADMIN -->
    <div id="loginSection" class="login-wrapper">
        <div class="login-card">
            <h2>🔐 Login Admin Toko</h2>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 24px;">Masukkan kredensial resmi KohanCopier.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Admin</label>
                    <input type="email" id="adminEmail" placeholder="admin@kohancopier.com" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btnLoginSubmit" class="btn-login">Masuk ke Dasbor 🚀</button>
                <div id="loginError" class="error-msg">❌ Email atau Password salah!</div>
            </form>
        </div>
    </div>

    <!-- SECTION 2: LAYAR DASHBOARD ADMIN -->
    <div id="dashboardSection" class="dashboard-wrapper">
        <div class="header">
            <div>
                <h1>🖨️ Dashboard Admin - KohanCopier</h1>
                <span id="adminUserLabel" style="font-size: 12px; color: #94a3b8;">Login sebagai: -</span>
            </div>
            <div class="header-actions">
                <button class="btn-action" onclick="loadOrders()">🔄 Refresh Data</button>
                <button class="btn-action btn-logout" onclick="logoutAdmin()">🚪 Logout</button>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>No. Antrean</th>
                        <th>Tanggal</th>
                        <th>Pemesan</th>
                        <th>Detail Cetak</th>
                        <th>Catatan</th>
                        <th>Ambil</th>
                        <th>Total</th>
                        <th>File Customer</th>
                        <th>Status Pesanan</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody">
                    <tr>
                        <td colspan="8" style="text-align: center; padding: 20px;">⏳ Memuat data pesanan...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
