<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - KohanCopier</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #334155; }
        h1 { margin: 0; font-size: 24px; color: #3b82f6; }
        .btn-refresh { background: #3b82f6; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-refresh:hover { background: #2563eb; }
        
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; }
        th, td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #334155; font-size: 14px; }
        th { background: #334155; color: #94a3b8; font-weight: 600; }
        tr:hover { background: #2a374e; }
        
        .status-select { padding: 6px 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-weight: bold; cursor: pointer; }
        .btn-download { display: inline-block; background: #16a34a; color: white; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 12px; }
        .btn-download:hover { background: #15803d; }
        .btn-wa { display: inline-block; background: #22c55e; color: white; padding: 6px 10px; border-radius: 6px; text-decoration: none; font-size: 12px; font-weight: bold; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🖨️ Dashboard Admin - KohanCopier</h1>
        <button class="btn-refresh" onclick="loadOrders()">🔄 Refresh Data</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Pemesan</th>
                <th>Detail Cetak</th>
                <th>Catatan</th>
                <th>Ambil</th>
                <th>Total</th>
                <th>File Customer</th>
                <th>Status Pesanan</th>
            </tr>
        </thead>
        <tbody id="adminTableBody">
            <tr>
                <td colspan="8" style="text-align: center;">⏳ Memuat pesanan...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    const SUPABASE_URL = "https://gputfcshhgppygipxzfh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwdXRmY3NoaGdwcHlnaXB4emZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxMjQxNDMsImV4cCI6MjEwNDcwMDE0M30.vhd6pH6jkNsbnnZsjgonc8xGc7yk-rQIZSgegiXbmBs";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadOrders() {
        const tbody = document.getElementById('adminTableBody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">⏳ Memuat pesanan...</td></tr>';

        const { data: orders, error } = await supabaseClient
            .from('orders')
            .select('*')
            .order('id', { ascending: false });

        if (error) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color:#ef4444;">❌ Gagal memuat data</td></tr>';
            return;
        }

        if (orders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Belum ada pesanan masuk.</td></tr>';
            return;
        }

        let html = '';
        orders.forEach(o => {
            const dateStr = new Date(o.created_at).toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });
            
            html += `
                <tr>
                    <td style="color:#94a3b8; font-size:12px;">${dateStr}</td>
                    <td>
                        <b>${o.nama}</b><br>
                        <span style="font-size:12px; color:#94a3b8;">${o.phone}</span><br>
                        <a class="btn-wa" href="https://wa.me/${o.phone}" target="_blank">📱 Chat WA</a>
                    </td>
                    <td>${o.detail_cetak}</td>
                    <td style="color:#cbd5e1; font-style:italic;">${o.catatan || '-'}</td>
                    <td style="color:#38bdf8; font-weight:bold;">${o.waktu_ambil}</td>
                    <td style="color:#4ade80; font-weight:bold;">Rp ${Number(o.total_harga).toLocaleString('id-ID')}</td>
                    <td>
                        ${o.file_url ? `<a href="${o.file_url}" target="_blank" class="btn-download" download>📥 Download File</a>` : 'Tidak Ada File'}
                    </td>
                    <td>
                        <select class="status-select" onchange="updateStatus(${o.id}, this.value)">
                            <option value="Menunggu Pembayaran (UNPAID)" ${o.status.includes('UNPAID') ? 'selected' : ''}>⏳ UNPAID</option>
                            <option value="🖨️ DIPROSES" ${o.status.includes('DIPROSES') ? 'selected' : ''}>🖨️ DIPROSES</option>
                            <option value="✅ SIAP DIAMBIL" ${o.status.includes('SIAP') ? 'selected' : ''}>✅ SIAP DIAMBIL</option>
                            <option value="🎉 SELESAI" ${o.status.includes('SELESAI') ? 'selected' : ''}>🎉 SELESAI</option>
                        </select>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    async function updateStatus(id, newStatus) {
        const { error } = await supabaseClient
            .from('orders')
            .update({ status: newStatus })
            .eq('id', id);

        if (error) {
            alert('❌ Gagal mengubah status');
        } else {
            alert('✅ Status berhasil diperbarui!');
        }
    }

    window.addEventListener('DOMContentLoaded', loadOrders);
</script>

</body>
</html>
