<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lacak Pesanan - KohanCopier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Lacak Pesanan Anda</h1>
        <form id="trackForm">
            <div class="form-group">
                <label for="orderIdInput">Masukkan ID Pesanan</label>
                <input type="text" id="orderIdInput" placeholder="Contoh: KC-1700000000000" required>
            </div>
            <button type="submit" class="btn-primary">Cari Pesanan</button>
        </form>

        <div id="trackResult"></div>
    </div>

    <script src="track.js"></script>
</body>
</html>
