<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin — KohanCopier</title>
  <link rel="stylesheet" href="">
  <style>
    /* Modal Login Overlay */
    .login-overlay {
      position: fixed;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      display: flex; 
      justify-content: center; 
      align-items: center;
      z-index: 1000;
    }
    .login-card {
      background: #ffffff; 
      padding: 32px; 
      border-radius: 12px;
      width: 100%; 
      max-width: 380px; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .admin-container { 
      max-width: 1100px; 
      margin: 40px auto; 
      padding: 0 24px; 
    }
    .table-responsive { 
      overflow-x: auto; 
      background: #ffffff; 
      border-radius: 12px; 
      border: 1px solid #e2e8f0; 
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      text-align: left; 
      font-size: 14px; 
    }
    th, td { 
      padding: 14px 16px; 
      border-bottom: 1px solid #e2e8f0; 
    }
    th { 
      background-color: #f8fafc; 
      color: #334155; 
      font-weight: 700; 
    }
    .badge-status { 
      padding: 4px 10px; 
      border-radius: 20px; 
      font-size: 12px; 
      font-weight: 700; 
    }
    .status-pending { 
      background-color: #fef3c7; 
      color: #d97706; 
    }
    .status-selesai { 
      background-color: #dcfce7; 
      color: #15803d; 
    }
    .btn-download { 
      background-color: #2563eb; 
      color: #ffffff; 
      padding: 6px 12px; 
      border-radius: 6px; 
      text-decoration: none; 
      font-size: 12px; 
      font-weight: 600; 
    }
    .btn-done { 
      background-color: #16a34a; 
      color: #ffffff; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 6px; 
      font-size: 12px; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

  <!-- Modal Form Login Admin -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-card">
      <h2 style="margin-bottom: 8px; color: #1e3a8a;">Login Admin</h2>
      <p style="font-size: 14px; color: #64748b; margin-bottom: 20px;">Masukkan kata sandi untuk mengakses dashboard pesanan.</p>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="adminPass">Kata Sandi</label>
          <input type="password" id="adminPass" class="form-control" placeholder="Masukkan password..." required>
        </div>
        <button type="submit" class="btn-submit" style="margin-top: 10px;">Masuk Dashboard</button>
      </form>
      <div id="loginError" class="error-msg" style="margin-top: 12px;"></div>
    </div>
  </div>

  <!-- Navbar Admin -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">⚡ Kohan<span>Copier</span> Admin</div>
      <div>
        <button onclick="logoutAdmin()" class="btn-secondary" style="padding: 6px 12px; font-size: 12px;">Keluar</button>
        <a href="index.html" class="btn-nav" style="margin-left: 8px;">Halaman Utama</a>
      </div>
    </div>
  </nav>

  <!-- Konten Dashboard -->
  <div class="admin-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
      <h2>Daftar Pesanan Masuk</h2>
      <button onclick="loadOrders()" class="btn-secondary" style="padding: 8px 16px;">🔄 Refresh Data</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Waktu</th>
            <th>ID Pesanan</th>
            <th>Nama File</th>
            <th>Hal</th>
            <th>Format</th>
            <th>Total Biaya</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody">
          <tr>
            <td colspan="8" style="text-align: center; color: #64748b;">Silakan login terlebih dahulu...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
