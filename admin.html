<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KohanCopier</title>
    <link rel="stylesheet" href="style.css?v=3">
    <style>
        .admin-wrapper { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; text-align: left; background: #fff; border-radius: 12px; overflow: hidden; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f1f5f9; color: #475569; font-weight: 700; }
    </style>
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="brand-logo">
                <span class="logo-icon">🖨️</span>
                <span class="logo-text">Kohan<span>Copier</span> Admin</span>
            </div>
            <a href="/" style="text-decoration: none; font-size: 14px; font-weight: 600; color: #2563eb;">← Halaman Utama</a>
        </div>
    </header>

    <div class="admin-wrapper">
        <!-- Form Login Admin -->
        <section class="card-box" id="loginSection" style="max-width: 480px; margin: 40px auto;">
            <div class="section-header">
                <h2>🔐 Login Admin</h2>
                <p>Masukkan kredensial untuk mengakses dashboard pesanan</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Masukkan username admin" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password admin" required>
                </div>
                <button type="submit" class="btn-primary" style="margin-top: 10px;">Masuk Dashboard</button>
            </form>
        </section>

        <!-- Dashboard Pesanan Admin -->
        <section class="card-box" id="dashboardSection" style="display: none;">
            <div class="section-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <div>
                    <h2>📋 Dashboard Pesanan Masuk</h2>
                    <p>Daftar seluruh pesanan cetak dokumen dari pelanggan</p>
                </div>
                <button onclick="loadOrders()" class="btn-secondary" style="padding: 10px 18px; font-size: 13px;">🔄 Refresh Data</button>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID Pesanan</th>
                            <th>Nama Customer</th>
                            <th>No WhatsApp</th>
                            <th>Detail Cetak</th>
                            <th>Status</th>
                            <th>Nama File</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr>
                            <td colspan="6" style="text-align:center; color: #64748b;">Memuat data pesanan...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="admin.js?v=3"></script>
</body>
</html>
