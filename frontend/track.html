<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Status Pesanan — KohanCopier</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .track-container {
      max-width: 500px;
      margin: 40px auto;
      padding: 32px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .status-card {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      background-color: #f8fafc;
      display: none;
    }
    .status-card.active {
      display: block;
    }
    .status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    .badge-status {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    .status-pending { background-color: #fef3c7; color: #d97706; }
    .status-selesai { background-color: #dcfce7; color: #15803d; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="logo">⚡ Kohan<span>Copier</span></div>
      <a href="index.html" class="btn-nav">Halaman Utama</a>
    </div>
  </nav>

  <div class="track-container">
    <div class="section-header">
      <h2>Lacak Status Pesanan</h2>
      <p>Masukkan ID Pesanan kamu (contoh: ORD-1712345678) untuk melihat progres cetak</p>
    </div>

    <form id="trackForm">
      <div class="form-group">
        <label for="orderIdInput">ID Pesanan</label>
        <input type="text" id="orderIdInput" class="form-control" placeholder="Masukkan ID Pesanan..." required>
      </div>
      <button type="submit" id="btnTrack" class="btn-submit">Cek Status</button>
    </form>

    <div id="trackError" class="error-msg"></div>

    <!-- Kartu Hasil Status -->
    <div id="statusCard" class="status-card">
      <div class="status-header">
        <span style="font-weight: 700; color: #1e3a8a;" id="resOrderId">ORD-0000</span>
        <span id="resBadge" class="badge-status status-pending">Pending</span>
      </div>

      <div class="result-row">
        <span class="label">Nama File:</span>
        <span class="value" id="resFileName">-</span>
      </div>
      <div class="result-row">
        <span class="label">Rincian Cetak:</span>
        <span class="value" id="resFormat">-</span>
      </div>
      <div class="result-row">
        <span class="label">Waktu Pemesanan:</span>
        <span class="value" id="resTime">-</span>
      </div>
      <div class="result-row price-total">
        <span class="label">Total Biaya:</span>
        <span class="value price-tag" id="resPrice">Rp0</span>
      </div>
    </div>
  </div>

  <script src="track.js"></script>
</body>
</html>
